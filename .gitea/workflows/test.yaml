name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # The race detector needs cgo, hence a C compiler on the runner.
      - name: Run tests
        run: |
          if command -v gcc >/dev/null; then
            go test -race ./...
          else
            echo "::warning::gcc not found: running tests without the race detector"
            go test ./...
          fi
