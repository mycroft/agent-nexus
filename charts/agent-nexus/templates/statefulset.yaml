{{- include "agent-nexus.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agent-nexus.fullname" . }}
  labels:
    {{- include "agent-nexus.labels" . | nindent 4 }}
spec:
  # The SQLite job store has a single writer: never more than one pod.
  replicas: 1
  serviceName: {{ include "agent-nexus.headlessName" . }}
  selector:
    matchLabels:
      {{- include "agent-nexus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.mcp.servers .Values.models }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.models }}
        # Rolls the pod when the models configuration changes.
        checksum/models: {{ include "agent-nexus.modelsConfig" . | sha256sum }}
        {{- end }}
        {{- if .Values.mcp.servers }}
        # Rolls the pod when the MCP configuration changes.
        checksum/mcp: {{ include "agent-nexus.mcpConfig" . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "agent-nexus.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent-nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: UI_ADDR
              value: ":8081"
            - name: DB_PATH
              value: /data/agent-nexus.db
            - name: EVENTS_PER_MINUTE
              value: {{ .Values.eventsPerMinute | quote }}
            - name: JOB_TIMEOUT
              value: {{ .Values.jobTimeout | quote }}
            - name: TRANSCRIPT_RETENTION
              value: {{ .Values.transcriptRetention | quote }}
            {{- include "agent-nexus.secretEnv" (dict "name" "API_KEYS" "secret" .Values.existingSecret "key" "api-keys") | nindent 12 }}
            {{- if .Values.zulip.enabled }}
            {{- include "agent-nexus.secretEnv" (dict "name" "ZULIP_WEBHOOK_TOKEN" "secret" .Values.existingSecret "key" "zulip-webhook-token") | nindent 12 }}
            {{- end }}
            {{- if .Values.runners.enabled }}
            {{- include "agent-nexus.secretEnv" (dict "name" "RUNNER_TOKENS" "secret" .Values.existingSecret "key" "runner-tokens") | nindent 12 }}
            {{- end }}
            {{- include "agent-nexus.agentEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: ui
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # git's HOME; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.mcp.servers }}
            - name: mcp
              mountPath: /etc/agent-nexus/mcp
              readOnly: true
            {{- end }}
            {{- if .Values.models }}
            - name: models
              mountPath: /etc/agent-nexus/models
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.mcp.servers }}
        - name: mcp
          configMap:
            name: {{ include "agent-nexus.fullname" . }}-mcp
        {{- end }}
        {{- if .Values.models }}
        - name: models
          configMap:
            name: {{ include "agent-nexus.fullname" . }}-models
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "agent-nexus.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
