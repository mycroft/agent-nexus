apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-nexus.fullname" . }}
  labels:
    {{- include "agent-nexus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: {{ .Values.service.uiPort }}
      targetPort: ui
      protocol: TCP
      name: ui
  selector:
    {{- include "agent-nexus.selectorLabels" . | nindent 4 }}
