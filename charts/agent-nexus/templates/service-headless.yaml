# Governs the StatefulSet: gives its pod a stable DNS name
# (<pod>.<service>.<namespace>.svc). Clients use the regular Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-nexus.fullname" . }}-headless
  labels:
    {{- include "agent-nexus.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agent-nexus.selectorLabels" . | nindent 4 }}
