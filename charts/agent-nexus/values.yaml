image:
  repository: registry.mkz.me/mycroft/agent-nexus
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Name of an existing Secret holding the credentials; the chart never
# creates it. Keys:
#   api-keys                "name=key,name=key", keys of 32+ characters (required)
#   llm-api-key             bearer token for the LLM server (optional)
#   <models[].apiKeyKey>    API key of that model (optional)
#   gitea-token             token of the Gitea bot (when gitea.enabled)
#   github-app-private-key  PEM private key of the GitHub App (when github.enabled)
#   zulip-bot-api-key       API key of the Zulip bot (when zulip.enabled)
#   zulip-webhook-token     token of the Zulip bot's outgoing webhook (when zulip.enabled)
#   <mcp.servers[].tokenKey> bearer token of that MCP server (optional)
existingSecret: ""

llm:
  # OpenAI-compatible API root, e.g. https://llm-api.example.com/v1.
  baseURL: ""
  model: ""
  # Context window in tokens; 0 asks llama-server's /props at startup.
  contextTokens: 0
  # Most tokens the model may reason for in one request, e.g. 6144; 0
  # leaves llama-server's default. Too low cuts its reasoning mid-thought;
  # too high makes each turn slow (the job timeout then ends the
  # investigation sooner).
  thinkingBudget: 0
  # Jobs run in parallel; match llama-server's --parallel.
  concurrency: 1
  # One completion, including the time llama-server keeps it queued.
  requestTimeout: 10m

# Several models instead of llm, rendered as the MODELS_CONFIG file (see
# README.md, "Models"). Leave llm.baseURL and llm.model empty with it. A
# queued job runs on the first model with a free slot among those serving
# it.
models: []
#  # Lowercase letters and digits.
#  - name: qwen
#    baseURL: https://llm-api.example.com/v1
#    model: Qwen3-32B
#    # Key of existingSecret holding its API key (optional).
#    apiKeyKey: llm-api-key
#    # Jobs running on it at once; match llama-server's --parallel.
#    concurrency: 1
#    # The jobs it serves: review, discussion, chat. Default: all.
#    jobs: [review, discussion, chat]
#    # As in llm: 0 asks /props, 0 keeps the server's default.
#    contextTokens: 0
#    thinkingBudget: 0
#    requestTimeout: 10m

gitea:
  enabled: false
  # Web root of the instance, e.g. https://gitea.example.com.
  url: ""
  # Login of the bot account owning gitea-token.
  user: agent-nexus

github:
  enabled: false
  appID: ""
  apiURL: https://api.github.com
  serverURL: https://github.com

# Answers questions about repositories and pull requests asked on Zulip,
# to an outgoing webhook bot calling POST /v1/events/zulip: mention it in a
# channel, or send it a direct message.
zulip:
  enabled: false
  # Root URL of the Zulip server, e.g. https://zulip.example.com.
  url: ""
  # Email of the bot, as shown in its zuliprc.
  botEmail: ""

# Repository owners whose pull requests may be reviewed, and whose
# repositories may be discussed on Zulip (required).
allowedOwners: []

review:
  # How reviews are submitted, per repository:
  #   comment  a plain comment review, without a verdict (the default)
  #   verdict  approve, comment or request changes, from the review's
  #            verdict (downgraded to a comment when it contradicts the
  #            findings)
  # The mode is decided by, first match wins:
  #   1. a rule below naming the repository exactly
  #   2. review.mode in the repository's .agent-nexus.yaml (base branch)
  #   3. a rule below with a pattern (path.Match, e.g. "mycroft/*")
  #   4. comment
  modes: []
  #  - repo: mycroft/k8s-home
  #    mode: verdict
  #  - repo: "mycroft/*"
  #    mode: comment
# Sustained event rate allowed per API key.
eventsPerMinute: 30
# Tool-calling turns per review.
agentMaxTurns: 30
# One job, end to end.
# The investigation stops early enough to write the review within it.
jobTimeout: 30m
# How long agent transcripts are kept.
transcriptRetention: 720h

# The agent reads Helm chart versions (chart_files, chart_read, chart_diff),
# image release notes (release_notes) and documentation pages (fetch_url)
# from what a reviewed repository's base branch already references,
# anonymously and only from public addresses.
fetch:
  # Hosts it may also read from: chart repositories, documentation sites,
  # image registries.
  allowedHosts: []
  #  - charts.example.com

# MCP servers whose tools the agent may call: Kubernetes, Grafana (with
# Prometheus and Loki), ... Each server holds its own credentials to its
# backend; agent-nexus only reaches the server, and only calls the tools
# listed here. See README.md, "MCP servers".
mcp:
  servers: []
  #  # Lowercase letters and digits, other than mcp.
  #  - name: k8s
  #    url: http://kubernetes-mcp-server.mcp.svc:8080/mcp
  #    # Tells the model what the server reads.
  #    description: the live state of the home Kubernetes cluster, read-only
  #    # The tools the model may call (path.Match patterns; "*" allows all).
  #    tools: [pods_list, pods_list_in_namespace, pods_get, pods_log, resources_get, resources_list, events_list]
  #    # The jobs that get them: chat, review, discussion. Default: chat.
  #    jobs: [chat]
  #    # lazy: the prompt names the server, and the model loads its tools
  #    # when they can help (mcp_tools, mcp_call). eager: its tools are the
  #    # model's own from the start (k8s_pods_list), each in every prompt.
  #    load: lazy
  #    # One tool call. Default: 1m.
  #    timeout: 1m
  #    # A key of existingSecret holding a bearer token for the server.
  #    tokenKey: ""
# debug, info, warn or error
logLevel: info

# Extra environment variables for the container.
extraEnv: []

# The SQLite job store and the bare repository cache. A single replica owns
# the volume: the chart always runs one pod.
persistence:
  size: 5Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  # Serves /metrics. The ingress only routes the http port.
  metricsPort: 9090
  # Serves the jobs UI. It has no authentication of its own: route it only
  # through an authenticating proxy (e.g. an Authentik outpost), never
  # through the ingress below.
  uiPort: 8081

# The event API authenticates callers with the API keys; it can be exposed.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agent-nexus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: agent-nexus-example-com-tls
  #    hosts:
  #      - agent-nexus.example.com

# Requires the Prometheus operator CRDs.
serviceMonitor:
  enabled: false
  # Labels the Prometheus instance selects ServiceMonitors by, e.g.
  # release: prometheus.
  labels: {}
  interval: ""

# git fetches and diffs of large repositories are the main memory users.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
